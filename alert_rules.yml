groups:
  - name: short-link-alerts
    interval: 30s
    rules:

      # ---- Availability ----
      - alert: ShortLinkDown
        expr: up{job="short-link-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Short-link application is down"
          description: "The short-link application has been unreachable for more than 1 minute."

      # ---- High Error Rate ----
      - alert: HighErrorRate
        expr: |
          rate(http_server_requests_seconds_count{job="short-link-app",status=~"5.."}[5m])
          / rate(http_server_requests_seconds_count{job="short-link-app"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is above 5% for the last 5 minutes."

      # ---- High Latency ----
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            rate(http_server_requests_seconds_bucket{job="short-link-app"}[5m])
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency exceeds 1 second"
          description: "The 99th percentile latency is above 1s."

      # ---- Sentinel Rate Limiting ----
      - alert: SentinelHighBlocking
        expr: rate(shortlink_sentinel_blocked_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Sentinel is blocking many requests"
          description: "More than 100 requests/s are being blocked by Sentinel rate limiting."

      # ---- Distributed Lock Failures ----
      - alert: HighLockFailureRate
        expr: rate(shortlink_lock_failure_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High distributed lock failure rate"
          description: "Lock acquisition failures exceeding 10/s, possible contention or Redis issue."

      # ---- Bloom Filter False Positive Rate ----
      - alert: BloomFilterHighFpp
        expr: shortlink_bloom_expected_fpp > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Bloom filter false positive rate too high"
          description: "The expected false positive probability has exceeded 1%, consider resizing."

      # ---- Redis Connection Issues ----
      - alert: RedisBloomErrors
        expr: rate(shortlink_bloom_error_total{tier="redis"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis Bloom filter errors"
          description: "Redis Bloom filter check errors exceeding 5/s."

      # ---- Cache Miss Rate ----
      - alert: HighCacheMissRate
        expr: |
          rate(shortlink_resolve_miss_total[5m])
          / (rate(shortlink_resolve_hit_total[5m]) + rate(shortlink_resolve_miss_total[5m])) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cache miss rate is high"
          description: "More than 30% of resolve requests are missing all cache tiers."

      # ---- Clock Drift ----
      - alert: ClockDriftAlert
        expr: abs(shortlink_clock_drift_ms) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Clock drift detected between JVM and Redis"
          description: "JVM clock is drifting from Redis by more than 100ms."
