version: '3.8'

services:
  # ===== MySQL Instance 0 (short_link_0) =====
  mysql-0:
    image: mysql:8.0
    container_name: short-link-mysql-0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: short_link_0
    ports:
      - "3306:3306"
    volumes:
      - mysql0-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=512M
    networks:
      - short-link-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MySQL Instance 1 (short_link_1) =====
  mysql-1:
    image: mysql:8.0
    container_name: short-link-mysql-1
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: short_link_1
    ports:
      - "3307:3306"
    volumes:
      - mysql1-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=512M
    networks:
      - short-link-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis Cluster (6 nodes: 3 master + 3 replica) =====
  redis-1:
    image: redis:7.2
    container_name: short-link-redis-1
    ports:
      - "7001:7001"
      - "17001:17001"
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes-7001.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7001
      --cluster-announce-bus-port 17001
    volumes:
      - redis1-data:/data
    networks:
      - short-link-net

  redis-2:
    image: redis:7.2
    container_name: short-link-redis-2
    ports:
      - "7002:7002"
      - "17002:17002"
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes-7002.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7002
      --cluster-announce-bus-port 17002
    volumes:
      - redis2-data:/data
    networks:
      - short-link-net

  redis-3:
    image: redis:7.2
    container_name: short-link-redis-3
    ports:
      - "7003:7003"
      - "17003:17003"
    command: >
      redis-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes-7003.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7003
      --cluster-announce-bus-port 17003
    volumes:
      - redis3-data:/data
    networks:
      - short-link-net

  redis-4:
    image: redis:7.2
    container_name: short-link-redis-4
    ports:
      - "7004:7004"
      - "17004:17004"
    command: >
      redis-server
      --port 7004
      --cluster-enabled yes
      --cluster-config-file nodes-7004.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7004
      --cluster-announce-bus-port 17004
    volumes:
      - redis4-data:/data
    networks:
      - short-link-net

  redis-5:
    image: redis:7.2
    container_name: short-link-redis-5
    ports:
      - "7005:7005"
      - "17005:17005"
    command: >
      redis-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes-7005.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7005
      --cluster-announce-bus-port 17005
    volumes:
      - redis5-data:/data
    networks:
      - short-link-net

  redis-6:
    image: redis:7.2
    container_name: short-link-redis-6
    ports:
      - "7006:7006"
      - "17006:17006"
    command: >
      redis-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes-7006.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 7006
      --cluster-announce-bus-port 17006
    volumes:
      - redis6-data:/data
    networks:
      - short-link-net

  # Redis Cluster initializer (runs once)
  redis-cluster-init:
    image: redis:7.2
    container_name: short-link-redis-cluster-init
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6
    command: >
      sh -c "sleep 5 && redis-cli --cluster create
      127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003
      127.0.0.1:7004 127.0.0.1:7005 127.0.0.1:7006
      --cluster-replicas 1 --cluster-yes"
    network_mode: host
    restart: on-failure

  # ===== Prometheus =====
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: short-link-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - short-link-net

  # ===== Alertmanager =====
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: short-link-alertmanager
    ports:
      - "9093:9093"
    networks:
      - short-link-net

  # ===== Grafana =====
  grafana:
    image: grafana/grafana:10.2.2
    container_name: short-link-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - short-link-net
    depends_on:
      - prometheus

networks:
  short-link-net:
    driver: bridge

volumes:
  mysql0-data:
  mysql1-data:
  redis1-data:
  redis2-data:
  redis3-data:
  redis4-data:
  redis5-data:
  redis6-data:
  prometheus-data:
  grafana-data:
